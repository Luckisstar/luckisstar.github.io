  - id: you-dont-need-long-context
    category: papers
    title: "You don't need long context: 잦은 컴팩션만으로 긴 작업을 짧은 컨텍스트에서 풀 수 있는가"
    why: "Peter Belcak, Pavlo Molchanov 등이 2026-11-03 arXiv에 공개한 논문으로, Hugging Face Daily Papers에서 업보트 19개(2026-11-09 기준)를 받았습니다. 뒤쪽 토큰 생성 비용이 앞쪽보다 최대 7배 비싸다는 측정과 함께 '긴 컨텍스트 모델이 꼭 필요한가'를 정면으로 묻습니다."
    angle: "블로그의 컨텍스트 엔지니어링, Remory, Cache Engineering, Pack Light CarryOn 글과 묶어 '컨텍스트를 짧게 유지하는' 접근들의 계보를 정리합니다. 한 컨텍스트에 행동 하나만 두는 SWE 실험과 SSSM(의미 상태 공간 모델) 개념이 실제 하네스 설계에 주는 의미를 보고, 코드가 공개되지 않은 점과 '정확도 손실이 거의 없다'는 주장의 범위를 원문 표로 확인합니다."
    sources:
      - https://arxiv.org/abs/2611.05306
    proposed_at: 2026-11-09
    status: approved
  - id: hybrid-computer-use
    category: papers
    title: "Hybrid Computer Use: 스크린샷 대신 코드·접근성 트리·GUI를 골라 쓰는 컴퓨터 사용 에이전트 인터페이스"
    why: "Microsoft Research 등이 2026-10-30 arXiv에 공개했고, 같은 내용을 MIT 라이선스 MCP 서버(computer-use)로 함께 공개했습니다. 논문은 OSWorld 2.0에서 비교 시스템 중 가장 높은 Partial·Binary 점수를 보고합니다."
    angle: "스크린샷과 마우스 중심 인터페이스가 왜 비효율적인지, 접근성(AX) 트리를 짧은 참조와 diff로 돌려주는 설계, 채널 전환 시 오래된 상태(stale state) 방지를 정리합니다. 블로그의 Player-1 글(GUI 행동 공간 확장)과 대비하고, Claude Code·Codex에 MCP로 붙이는 방법은 README 명령만 인용합니다. 정확한 점수는 원문 표로 확인합니다."
    sources:
      - https://arxiv.org/abs/2610.41432
      - https://github.com/microsoft/Hybrid-Computer-Use
    proposed_at: 2026-11-09
    status: approved
  - id: kimi-k3-1-pro
    category: tech
    title: "Kimi K3.1 Pro: 2.8T MoE 오픈웨이트, 그러나 매출·사용자 조건이 붙은 수정 MIT 라이선스"
    why: "Moonshot AI가 2026-11-02 Hugging Face에 가중치를 올렸습니다(2026-11-09 기준 좋아요 약 1,700개, Hacker News 600점 이상). 모델 카드 기준 총 2.8T, 활성 104B 파라미터, 1M 토큰 컨텍스트입니다."
    angle: "라이선스가 MIT 형식이지만 연 매출 2,000만 달러 초과 MaaS 사업자의 별도 계약, 월 활성 1억 명 또는 월 매출 2,000만 달러 초과 시 표기 의무가 붙어 OSI 오픈소스가 아니라는 점을 앞부분에 표시합니다. 블로그의 Meta Muse Spark Open 글과 '오픈웨이트 라이선스' 관점에서 비교하고, KDA·Gated DSA 하이브리드 어텐션 구조와 vLLM·SGLang 배포 경로를 모델 카드 기준으로 정리합니다. 벤치마크는 제조사 자체 보고임을 밝힙니다."
    sources:
      - https://huggingface.co/moonshotai/Kimi-K3.1-Pro
      - https://huggingface.co/moonshotai/Kimi-K3.1-Pro/blob/main/LICENSE
    proposed_at: 2026-11-09
    priority: high
    status: approved
  - id: claude-message-threads
    category: tech
    title: "Claude API 메시지 스레드: 대화 기록을 매번 보내지 않는 Messages API 베타"
    why: "Anthropic이 2026-11-02 릴리스 노트로 Messages API의 메시지 스레드 베타를 발표했습니다. 지금까지 상태 없이(stateless) 매 요청마다 전체 대화를 보내야 했던 Messages API에서 서버가 대화를 잠시 보관하는 첫 공식 기능입니다."
    angle: "thread 파라미터와 베타 헤더, 5분 만료와 thread_not_found 시 SDK의 전체 재전송 같은 동작을 공식 문서 기준으로 정리합니다. 블로그의 프롬프트 캐싱, 컨텍스트 엔지니어링 글과 연결해 캐싱·컴팩션·컨텍스트 편집과 무엇이 다른지 짚고, ZDR·HIPAA 비대상이라는 제약을 도입 판단 요소로 앞부분에 표시합니다."
    sources:
      - https://platform.claude.com/docs/en/build-with-claude/message-threads
      - https://platform.claude.com/docs/en/release-notes/overview
    proposed_at: 2026-11-09
    status: approved
  - id: libghostty
    category: opensource
    title: "libghostty 1.0: Ghostty의 터미널 에뮬레이션 엔진을 안정된 C ABI 라이브러리로"
    why: "Mitchell Hashimoto가 2026-11-06 libghostty(libghostty-vt) 1.0을 발표했습니다(MIT). 발표 글 기준 JetBrains IDE 터미널이 이미 쓰고 있고, Neovim의 libvterm 대체 PR이 승인됐으며, Hacker News에서 1,000점 이상을 받았습니다."
    angle: "'터미널 앱'이 아니라 '터미널 기능을 앱에 넣는 라이브러리'라는 위치, semver와 libabigail로 지키는 ABI 호환 약속, WebAssembly를 포함한 플랫폼 범위를 정리합니다. 에이전트 도구들이 터미널을 내장하는 흐름(블로그의 Orca 글 등)과 연결하고, 발표 글의 수치(4코어 서버에서 터미널 1만 개 등)는 출처를 밝혀 인용합니다."
    sources:
      - https://mitchellh.com/writing/libghostty-1-0
      - https://github.com/ghostty-org/ghostty
    proposed_at: 2026-11-09
    priority: high
    status: approved
  - id: tokeneconomizer
    category: opensource
    title: "TokenEconomizer: 같은 저장소에서 반복되는 코딩 에이전트 비용을 학습으로 줄이는 플러그인"
    why: "UC Berkeley와 Microsoft가 공개한 Apache-2.0 저장소로, 2026-11-09 기준 GitHub 스타 약 5,200개입니다. README 기준 SWE-Bench 277개 과제에서 다섯 가지 에이전트·모델 조합의 평균 비용을 18.4~30.9% 줄였다고 보고합니다(arXiv 2610.22732)."
    angle: "마이크로 스킬, 도구 가지치기, 실패 루프 개입이라는 세 장치와 '캐시 가격 기준으로 비용을 센다'는 원칙을 정리합니다. 블로그의 프롬프트 캐싱, Claude Haiku 5.5(에이전트 비용) 글과 연결하고, Claude Code·Codex·Copilot CLI 설치는 README 명령만 인용합니다. 연구 저장소라 장기 유지보수 여부와 자체 보고 수치의 한계를 짚습니다."
    sources:
      - https://github.com/microsoft/TokenEconomizer
      - https://arxiv.org/abs/2610.22732
    proposed_at: 2026-11-09
    status: approved
