    why: "Google이 2026-11-12 공개했습니다. 입력 100만 토큰당 1.5달러, 출력 7.5달러(컨텍스트 전 구간 동일), 입력·출력 각각 최대 100만 토큰이며, 새 xhigh 사고 수준을 추가했습니다. GeekNews에서도 화제가 됐습니다."
    angle: "블로그의 Gemini 4 Argon 글의 후속으로, 장기 추론용 Carbon·Argon과 빠른 실행용 Hydrogen을 섞어 쓰는 오케스트레이션(Terminal-Bench에서 쿼터 24% 절감 주장)이 실무 비용 설계에 주는 의미를 짚습니다. 벤치마크는 Google 자체 발표 기준임을 표시하고, 모델 ID와 가격은 Gemini API 문서로 다시 확인합니다."
