    angle: "블로그의 LocalStack 글과 직접 비교할 수 있는 주제입니다. 서비스별 크레이트 구조, 릴리스마다 공개한다는 충실도(fidelity) 점수, 에이전트 스킬 설치 방식을 README 기준으로 정리하고, 텔레메트리 기본 활성화와 PR을 받지 않는 운영 방식을 앞부분에 표시합니다. LocalStack 쪽 비교 내용은 공식 자료로 확인한 범위에서만 씁니다."
    sources:
      - https://github.com/aws/aws-emulator
    proposed_at: 2026-11-16
    priority: high
    status: approved
