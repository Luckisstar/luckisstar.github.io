name: Validate posts

on:
  pull_request:
    paths:
      - "_posts/**"
      - "editorial/**"
      - "scripts/validate_posts.py"
  push:
    branches: [main]
    paths:
      - "_posts/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_posts.py
