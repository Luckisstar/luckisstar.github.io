theme: jekyll-theme-minimal
title: Luckisstar
description: "AI 논문, 최신 기술, 개발자에게 유용한 오픈소스 프로젝트를 한국어로 깊이 있게 소개하는 블로그입니다."
url: "https://luckisstar.github.io"
baseurl: ""
lang: ko
timezone: Asia/Seoul
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png
twitter:
  card: summary_large_image
exclude:
  - CLAUDE.md
  - README.md
  - editorial/
  - scripts/
  - .github/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
